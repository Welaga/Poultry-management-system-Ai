<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Files - Poultry MS</title>
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <div class="layout">
        <div id="sidebar"></div>
        <main class="main-content">
            <button class="mobile-menu-btn" onclick="openMobileSidebar()" aria-label="Open menu">☰</button>
            <header class="page-header">
                <h1>📁 Files & Records</h1>
                <p>Upload and manage receipts, documents and images</p>
            </header>

            <section class="card">
                <h3>Upload Document</h3>
                <form id="uploadForm" class="form-grid">
                    <div class="form-group"><label>File</label><input type="file" id="fileInput" required></div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="fileCategory">
                            <option value="general">General</option>
                            <option value="receipt">Receipt</option>
                            <option value="invoice">Invoice</option>
                            <option value="report">Report</option>
                            <option value="image">Image</option>
                            <option value="document">Document</option>
                        </select>
                    </div>
                    <div class="form-group form-full"><label>Description</label><input type="text" id="fileDesc"></div>
                    <div class="form-actions"><button type="submit" class="btn btn-primary">Upload</button></div>
                </form>
            </section>

            <section class="card">
                <h3>Uploaded Files</h3>
                <div id="filesGrid" class="files-grid">Loading...</div>
            </section>
        </main>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        initLayout('files');

        async function loadFiles() {
            try {
                const resp = await apiGet('/files/list');
                const files = resp.files || [];
                const grid = document.getElementById('filesGrid');
                if (files.length === 0) {
                    grid.innerHTML = '<p class="muted">No files uploaded yet</p>';
                    return;
                }
                grid.innerHTML = files.map(f => {
                    const isImage = f.file_type === 'image';
                    return `
                    <div class="file-card">
                        ${isImage ? `<img src="${f.url}" class="file-thumb">` : `<div class="file-icon">📄</div>`}
                        <div class="file-name">${f.original_name}</div>
                        <div class="file-meta">
                            <span class="badge">${f.category}</span>
                            <small>${(f.size / 1024).toFixed(1)} KB</small>
                        </div>
                        <div class="file-meta"><small>${formatDate(f.uploaded_at)}</small></div>
                        ${f.description ? `<div class="file-desc">${f.description}</div>` : ''}
                        <div class="file-actions">
                            <a href="${f.url}" target="_blank" class="btn btn-sm btn-secondary">View</a>
                            <button class="btn btn-sm btn-danger" onclick="deleteFile(${f.id})">Delete</button>
                        </div>
                    </div>`;
                }).join('');
            } catch (err) { showAlert('Failed: ' + err.message, 'error'); }
        }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = document.getElementById('fileInput').files[0];
            if (!file) return;
            const fd = new FormData();
            fd.append('file', file);
            fd.append('category', document.getElementById('fileCategory').value);
            fd.append('description', document.getElementById('fileDesc').value);
            try {
                await apiUpload('/files/upload', fd);
                showAlert('Uploaded', 'success');
                e.target.reset();
                loadFiles();
            } catch (err) { showAlert('Failed: ' + err.message, 'error'); }
        });

        async function deleteFile(id) {
            if (!confirm('Delete this file?')) return;
            try {
                await apiDelete('/files/' + id);
                showAlert('Deleted', 'success');
                loadFiles();
            } catch (err) { showAlert('Failed: ' + err.message, 'error'); }
        }

        loadFiles();
    </script>
</body>
</html>
